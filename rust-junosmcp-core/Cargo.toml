[package]
name        = "rust-junosmcp-core"
version     = "0.27.4"
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
description = "Core logic and Junos tool handlers for rust-junosmcp."

[lints.rust]
missing_docs = "deny"
unsafe_code  = "forbid"

[lints.clippy]
all         = { level = "warn", priority = -1 }
dbg_macro   = "deny"
todo        = "deny"
unwrap_used = "deny"

[dependencies]
chrono       = { workspace = true }
tokio        = { workspace = true }
tokio-util   = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true, features = ["preserve_order"] }
thiserror    = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
schemars     = { workspace = true }
rustez       = { workspace = true }
globset      = { workspace = true }
regex        = { workspace = true }
async-trait  = { workspace = true }
minijinja    = { workspace = true }
arc-swap     = { workspace = true }
tempfile     = { workspace = true }
sha2         = { workspace = true }
axum         = { workspace = true }
tower-http   = { workspace = true, features = ["limit"] }
http         = { workspace = true }
http-body    = { workspace = true }
http-body-util = { workspace = true }
rmcp         = { version = "3", features = ["server", "transport-streamable-http-server"] }
rust-junosmcp-auth = { version = "0.27.4", path = "../rust-junosmcp-auth" }
mecmcp-transport = { workspace = true }
mecmcp-policy = { workspace = true }
mecmcp-inventory = { workspace = true }
mecmcp-device = { workspace = true }
mecmcp-changeset = { workspace = true }
mecmcp-audit = { workspace = true }
mecmcp-scp = { workspace = true }
mecmcp-secret = { workspace = true }
mecmcp-redact = { workspace = true }
dashmap      = { workspace = true }
futures      = "0.3"
rustnetconf  = { workspace = true }

[dev-dependencies]
# `seed_change_set_for_test` is behind this feature. Since mecmcp 0.22.0
# `insert_change_set` creates `Planned` and nothing else, so fixtures that need
# a record already sitting in `Applied` go through the explicit test door
# rather than the production one being widened for them. Dev-only: a release
# build of the server never enables it.
mecmcp-changeset = { workspace = true, features = ["test-util"] }
tower        = { workspace = true }
mecmcp-audit = { workspace = true }
uuid         = "1"
# Test-only fixture SSH server for tests/ssh_host_key_fixture.rs (MEC-44):
# proves `SshHostKeyMode::AcceptNew` refuses a changed host key end-to-end,
# not just that it maps to the right enum variant. Same version rustnetconf
# depends on; never shipped in the server binary.
russh        = { version = "0.63", default-features = false, features = ["ring"] }
zeroize      = "1"
