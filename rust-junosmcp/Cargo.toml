[package]
name        = "rust-junosmcp"
version     = "0.27.5"
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true
description = "Unified MCP server for Juniper Junos and SRX devices, built on rustEZ."

[lints.rust]
missing_docs = "deny"
unsafe_code  = "forbid"

[lints.clippy]
all         = { level = "warn", priority = -1 }
dbg_macro   = "deny"
todo        = "deny"
unwrap_used = "deny"

[features]
default = ["tls", "srx"]
# `rustls` is unconditional: mecmcp-transport owns the listener and its
# `serve_router` signature names `rustls::ServerConfig` whether or not TLS is
# configured, so a --no-default-features build still has to name the type.
# The `tls` feature still gates what is TLS-specific here: reading a cert and
# key off disk, and axum-server.
tls = ["dep:rustls-pki-types", "dep:axum-server"]
srx = ["dep:rust-junosmcp-srx-core"]

[lib]
name = "rust_junosmcp"
path = "src/lib.rs"

[[bin]]
name = "rust-junosmcp"
path = "src/main.rs"

# These migrated suites exercise SRX-only tools and must not be selected for
# Junos-only builds. Keeping the requirement on each target also makes Cargo's
# feature boundary visible to CI and downstream contributors.
[[test]]
name = "srx_audit"
path = "tests/srx_audit.rs"
required-features = ["srx"]

[[test]]
name = "srx_http_limits"
path = "tests/srx_http_limits.rs"
required-features = ["srx"]

[[test]]
name = "srx_http_metrics"
path = "tests/srx_http_metrics.rs"
required-features = ["srx"]

[[test]]
name = "srx_http_smoke"
path = "tests/srx_http_smoke.rs"
required-features = ["srx"]

[[test]]
name = "srx_http_tls"
path = "tests/srx_http_tls.rs"
required-features = ["srx"]

[[test]]
name = "srx_live_smoke"
path = "tests/srx_live_smoke.rs"
required-features = ["srx"]

[dependencies]
rust-junosmcp-core = { version = "0.27.5", path = "../rust-junosmcp-core" }
rust-junosmcp-auth = { version = "0.27.5", path = "../rust-junosmcp-auth" }
mecmcp-audit = { workspace = true }
mecmcp-auth = { workspace = true }
mecmcp-changeset = { workspace = true }
mecmcp-transport = { workspace = true, features = ["verified-approver"] }
mecmcp-runtime = { workspace = true }
mecmcp-secret = { workspace = true }
mecmcp-redact = { workspace = true }
mecmcp-oidc = { workspace = true }
mecmcp-http = { workspace = true }
rust-junosmcp-srx-core = { version = "0.27.5", path = "../rust-junosmcp-srx-core", optional = true }
tokio              = { workspace = true }
tokio-util         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
sha2               = { workspace = true }
rand               = { workspace = true }
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3", features = [
    "server",
    "macros",
    "transport-io",
    "schemars",
    "transport-streamable-http-server",
] }
schemars           = { workspace = true }
arc-swap           = { workspace = true }
axum               = { workspace = true }
tower              = { workspace = true }
tower-http         = { workspace = true, features = ["trace"] }
http               = { workspace = true }
rustls             = { workspace = true }
rustls-pki-types   = { workspace = true, optional = true }
axum-server        = { workspace = true, optional = true, default-features = false, features = ["tls-rustls-no-provider"] }
rustix             = { workspace = true, features = ["process"] }

[dev-dependencies]
mecmcp-audit = { workspace = true, features = ["test-util"] }
mecmcp-transport = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
ureq = { workspace = true, features = ["json", "tls"] }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tower = { workspace = true }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
