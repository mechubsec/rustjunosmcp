[package]
name        = "rust-junosmcp-srx-core"
version     = "2.6.1"
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
description = "SRX-specific workflow core for rust-junosmcp."

[lints]
workspace = true

[dependencies]
rust-junosmcp-core = { version = "2.6.1", path = "../rust-junosmcp-core" }
rustez             = { workspace = true }
serde              = { workspace = true, features = ["derive"] }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
schemars           = { workspace = true }
quick-xml          = "0.42"
roxmltree          = "0.21"
mecmcp-redact      = { workspace = true }
# Address/prefix parsing for srx_resolve_address (MEC-54). Already resolved
# transitively (2.12.x) by the existing dependency graph; taken as a direct
# dep so address-book resolution gets typed prefixes instead of raw strings.
ipnet              = { version = "2", features = ["serde"] }
# Feed URL sanitising for get_srx_feed_status (#528): userinfo, query and
# fragment are stripped by a real parser, since hand-splitting gets `@`/`?`
# inside userinfo wrong. Already resolved transitively (2.5.x, via reqwest).
url                = "2"
# Credential scrub for get_srx_feed_status (#528): every occurrence of every
# configured secret, overlaps included, in one linear search. Already in the
# lock via regex.
aho-corasick       = "1"
# Percent-decode URL userinfo exactly as the `url` parser encoded it (#528).
# Already in the lock via url.
percent-encoding   = "2"
time               = { version = "0.3", features = ["serde", "parsing", "formatting", "macros"] }
tokio              = { workspace = true, features = ["macros", "rt", "time"] }
uuid               = { version = "1", features = ["v4"] }
sha2               = "0.11"
# Archive the support bundle in-process. Shelling out to `tar` made every
# container image carry a shell and utilities purely so one tool would work —
# exactly the pivot an attacker wants after an RCE on a process holding bearer
# credentials for a firewall fleet (#212).
tar                = "0.4"
flate2             = "1"
rand                = { workspace = true }
base64ct            = { workspace = true }

[dev-dependencies]
pretty_assertions  = "1"
# The archive tests read back what `write_bundle_archive` produced.
tar                = "0.4"
flate2             = "1"
tempfile            = { workspace = true }
tokio              = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
