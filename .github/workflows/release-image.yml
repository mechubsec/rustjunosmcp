name: Release image

# Build and publish the default-feature Junos/SRX rust-junosmcp image to GHCR
# on every version tag (v1.2.3).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the image, e.g. v0.7.0 (-> tags 0.7.0, 0.7, latest)'
        required: true
      ref:
        description: 'Git ref/commit to build (default: the branch this workflow runs from, usually main). Use this to backfill a release whose own tagged tree predates a Dockerfile fix.'
        required: false
        default: ''

jobs:
  release:
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing exchanges this job's OIDC token for a
      # short-lived Fulcio certificate; no key material is stored anywhere.
      # This workflow only ever runs from a version-tag push or an explicit
      # workflow_dispatch backfill of an already-tagged release (see the
      # `ref` input above) -- never from a PR or an untagged branch push --
      # so a Rekor transparency-log entry is only ever created for a
      # board-approved release. A reusable workflow's permissions can only
      # be narrowed by the caller, never widened, so this job must grant
      # them itself -- see mecmcp's docs/RELEASE-WORKFLOWS.md.
      id-token: write
    # Pinned to mecmcp main after #440 merged (squash). Repin to a mecmcp tag once one is cut.
    uses: mechubsec/mecmcp/.github/workflows/reusable-release-image.yml@4815d7b4121be78745ceeae12c25ed86d6da9b2f
    with:
      # GHCR requires a lowercase image path; github.repository is already lowercase.
      image: ghcr.io/${{ github.repository }}
      dockerhub-image: docker.io/mechub/rustjunosmcp
      description: 'Junos/SRX MCP server'
      version: ${{ github.event.inputs.version }}
      ref: ${{ github.event.inputs.ref }}
      smoke-test-command: ./packaging/tests/container-scp-smoke.sh
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  tag-version:
    name: Resolve tag version
    # reusable-registry-publish.yml re-verifies the pushed tag's signature
    # itself and has no workflow_dispatch story, so this job (and the
    # registry-publish job below) only runs for the tag-push trigger.
    if: github.event_name == 'push'
    permissions: {}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Strip leading v from the pushed tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  registry-publish:
    name: Publish to MCP Registry
    if: github.event_name == 'push'
    needs: [release, tag-version]
    permissions:
      contents: read
      id-token: write
    uses: mechubsec/mecmcp/.github/workflows/reusable-registry-publish.yml@b1ca7b0a24cf7e7179e46b94a86e97ac8ebc23ba # v0.28.0
    with:
      version: ${{ needs.tag-version.outputs.version }}
      oci-image: ghcr.io/${{ github.repository }}:${{ needs.tag-version.outputs.version }}
