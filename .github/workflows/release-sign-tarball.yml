name: Sign release tarball

# Historically the LXC release tarball was uploaded to the GitHub release by
# hand as the last step of the documented release process (see
# docs/superpowers/specs/2026-07-16-v0.8.0-release-design.md), after the tag
# push and the `Release image` workflow had already run. That manual step was
# skipped for v0.27.1, so `sign` failed with "no assets to download" -- there
# was nothing to sign (MEC-1066). `build-tarball` and `upload-tarball` below
# replace the hand step: they build and attach the tarball so `sign` always
# has something to work with.
#
# Jobs trigger on `release: published`, not the tag push itself -- the
# release does not exist yet at tag-push time. A release is only published
# by the board user, so this never fires from a PR, a branch push, or an
# unreviewed tag.
#
# `workflow_dispatch` backfills the tarball, checksum, and signature onto an
# already-published release whose own `release: published` run did not attach
# them. The `tag` input must name an existing GitHub-verified signed tag that
# already has a published (non-draft) release; the workflow checks that
# before building and refuses anything else. Agents cannot dispatch; the
# board runs `gh workflow run release-sign-tarball.yml -f tag=vX.Y.Z`.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing GitHub-verified signed tag with a published release to backfill, e.g. v0.27.5'
        required: true
        type: string

jobs:
  resolve-tag:
    name: Verify signed published tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - name: Verify tag is annotated, GitHub-verified, and published
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be vMAJOR.MINOR.PATCH, got '$TAG'."
            exit 1
          fi
          if ! object_type=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.type'); then
            echo "::error::$TAG is not a tag in ${GITHUB_REPOSITORY}."
            exit 1
          fi
          if [[ "$object_type" != "tag" ]]; then
            echo "::error::$TAG is a lightweight tag ($object_type object) -- release tags must be annotated and signed (git tag -s $TAG)."
            exit 1
          fi
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')
          verified=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.verified')
          if [[ "$verified" != "true" ]]; then
            reason=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.reason')
            echo "::error::$TAG is not a GitHub-verified signature (reason: $reason). Sign it with a GPG or SSH key registered to your GitHub account: git tag -s $TAG -m '...' && git push origin $TAG."
            exit 1
          fi
          if ! draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.draft'); then
            echo "::error::$TAG has no GitHub release."
            exit 1
          fi
          if [[ "$draft" != "false" ]]; then
            echo "::error::$TAG has a draft release; backfill and sign only run against a published release."
            exit 1
          fi
          echo "$TAG: annotated, GitHub-verified, published"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-tarball:
    name: Build LXC tarball (Debian 13)
    needs: resolve-tag
    runs-on: ubuntu-24.04
    # The binary is tied to the build host's glibc (see README "The container
    # MUST be Debian 13"): whatever glibc the build container ships becomes
    # the floor a deployment host must meet. Building in a `debian:trixie`
    # container makes that floor Debian 13's glibc 2.41 -- the LXC install
    # target documented in the README -- instead of whatever glibc a GitHub-
    # hosted `ubuntu-24.04` runner happens to ship, which is not a supported
    # install target and could drift independently of this repo.
    #
    # Pinned by digest (2026-09-30) rather than the floating `debian:trixie`
    # tag: a tag can move to a point release with a newer glibc at any time,
    # which would silently raise the floor documented above. Repin
    # deliberately when Debian 13 gets a point release worth adopting.
    container:
      image: debian:trixie@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      # git must exist before actions/checkout runs -- debian:trixie ships
      # without it, and checkout should use a real git clone here rather
      # than fall back to its no-git REST download path.
      - name: Install build toolchain
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config

      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      # Container jobs bind-mount the workspace owned by the runner user
      # while the job process runs as root. git then refuses the tree
      # (package-lxc.sh calls `git rev-parse` for BUILD-INFO). Trust both
      # $GITHUB_WORKSPACE and pwd: one is often a symlink of the other.
      - name: Trust the workspace for git
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$(pwd)"

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build release binary
        # rustup auto-installs the toolchain pinned in rust-toolchain.toml
        # (1.98.0) the first time cargo runs in this checkout.
        run: cargo build --release --locked -p rust-junosmcp

      - name: Package LXC tarball
        run: JMCP_PACKAGE_SKIP_BUILD=1 ./scripts/package-lxc.sh

      - name: Verify GLIBC ceiling
        # Debian 13 ships glibc 2.41 (see README). A binary requiring
        # anything newer could not have been produced by this container, so
        # exceeding 2.41 here means the container image itself drifted --
        # fail closed rather than ship a tarball that cannot install on the
        # documented target.
        run: |
          set -euo pipefail
          max_glibc=$(objdump -T target/release/rust-junosmcp \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo ">> Binary requires glibc <= ${max_glibc}"
          highest=$(printf '%s\n%s\n' "$max_glibc" "2.41" | sort -V | tail -1)
          if [[ "$highest" != "2.41" ]]; then
            echo "rust-junosmcp requires glibc ${max_glibc}, which exceeds Debian 13's 2.41" >&2
            exit 1
          fi

      - name: Upload tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lxc-tarball
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error

  upload-tarball:
    name: Attach tarball to release
    needs: [resolve-tag, build-tarball]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # gh release upload
    timeout-minutes: 10
    steps:
      - name: Download tarball artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lxc-tarball
          path: dist

      - name: Upload tarball to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        # --clobber: a re-run after a partial failure must be able to
        # re-upload without deleting the assets by hand first (matches
        # release-sbom.yml's SBOM upload for the same reason).
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 --repo "${{ github.repository }}" --clobber

  sign:
    needs: [resolve-tag, upload-tarball]
    permissions:
      contents: write
      # Keyless cosign signing exchanges this job's OIDC token for a
      # short-lived Fulcio certificate; no key material is stored anywhere.
      # A reusable workflow's permissions can only be narrowed by the
      # caller, never widened, so this job must grant them itself -- see
      # mecmcp's docs/RELEASE-WORKFLOWS.md.
      id-token: write
    # Pinned to mecmcp main after #440 merged (squash). Repin to a mecmcp tag once one is cut.
    uses: mechubsec/mecmcp/.github/workflows/reusable-sign-release-tarball.yml@f927c820f39369b2601e11e31334cc5b504b1fd1
    with:
      tag: ${{ needs.resolve-tag.outputs.tag }}
