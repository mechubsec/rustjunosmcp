name: Release SBOM

# The `Release image` workflow (release-image.yml) already generates a
# CycloneDX SBOM via mecmcp's reusable-release-image.yml, but only uploads it
# as a 90-day CI artifact -- it is not attached to the GitHub release, and
# the image carries no SBOM attestation of its own. This closes both gaps:
# a release asset a consumer can download without CI retention, and an
# in-toto attestation on the image itself that `cosign verify-attestation`
# can check against the exact digest that was pulled.
#
# The SBOM covers only the Rust dependency graph (from rust-junosmcp's
# Cargo.toml), not the image's runtime base (gcr.io/distroless/cc-debian13:
# glibc, libgcc, libssl, ca-certificates). Call it a "Rust dependency SBOM"
# anywhere a reader might otherwise take it as a full image SBOM.
#
# Triggered on `release: published`, matching release-sign-tarball.yml's
# reasoning: the release does not exist at tag-push time, and by the time a
# maintainer publishes it the tag-triggered `Release image` build has
# already pushed the image this workflow attests.
on:
  release:
    types: [published]

jobs:
  sbom:
    name: Generate SBOM, attach to release, attest on image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write # gh release upload
      packages: write # cosign attest pushes the attestation to GHCR
      id-token: write # keyless cosign signing (see reusable-release-image.yml)
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      # Pinned version matches mecmcp's security.yml sbom job for consistency
      # across the org. The SBOM is not byte-for-byte reproducible (timestamps,
      # serial numbers), but the component set must be stable.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate SBOM
        # cargo-cyclonedx always walks the whole Cargo workspace (it has no
        # per-package `-p` flag) and writes one SBOM per member; only
        # rust-junosmcp/rust-junosmcp.cdx.json -- the shipped binary -- is
        # used below.
        run: cargo cyclonedx --format json --manifest-path rust-junosmcp/Cargo.toml

      - name: Validate SBOM shape
        run: |
          set -euo pipefail
          sbom=rust-junosmcp/rust-junosmcp.cdx.json
          [[ -f "$sbom" ]] || { echo "$sbom was not generated" >&2; exit 1; }
          format=$(jq -r '.bomFormat' "$sbom")
          [[ "$format" == "CycloneDX" ]] || {
            echo "$sbom: bomFormat is '$format', not CycloneDX" >&2
            exit 1
          }
          component_count=$(jq '.components | length' "$sbom")
          [[ "$component_count" -gt 0 ]] || {
            echo "$sbom: components array is empty" >&2
            exit 1
          }

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is built and pushed by `Release image`, triggered by the
      # tag push, while this workflow is triggered by the release being
      # published -- two independent events with no ordering guarantee
      # between them. A release published right after tagging can fire
      # before the multi-arch build finishes pushing, so resolve by polling
      # instead of a single lookup (MEC-2133). Resolve by the immutable
      # semver tag docker/metadata-action derived from this same release tag
      # (v1.2.3 -> 1.2.3), not `latest`, which a concurrent release could have
      # already moved.
      #
      # This runs, and the attest step below it runs, before the release
      # asset is uploaded: if `Release image` hasn't finished yet, resolving
      # the digest fails closed here with no release asset uploaded, and a
      # plain job re-run can pick up cleanly. Uploading the SBOM first would
      # leave a release with an asset but no attestation on a re-run failure,
      # and gh release upload without --clobber would then refuse to
      # re-upload it.
      - name: Resolve image digest
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          digest=""
          for attempt in $(seq 1 20); do
            if resolved=$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest) \
              && [[ -n "$resolved" && "$resolved" != "null" ]]; then
              digest="$resolved"
              break
            fi
            echo "image ${IMAGE}:${version} not available yet (attempt ${attempt}/20); Release image may still be building -- waiting 60s"
            sleep 60
          done
          [[ -n "$digest" ]] || { echo "could not resolve digest for ${IMAGE}:${version} after 20 attempts (~20 min)" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: cosign attest SBOM (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign attest --yes --predicate rust-junosmcp/rust-junosmcp.cdx.json --type cyclonedx "${IMAGE}@${DIGEST}"

      - name: Attach SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        # --clobber: a re-run after a partial failure must be able to
        # re-upload without deleting the asset by hand first.
        run: gh release upload "$TAG" rust-junosmcp/rust-junosmcp.cdx.json --repo "${{ github.repository }}" --clobber
