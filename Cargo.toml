[workspace]
members          = ["rust-junosmcp", "rust-junosmcp-core", "rust-junosmcp-auth", "rust-junosmcp-srx-core"]
default-members  = ["rust-junosmcp", "rust-junosmcp-core", "rust-junosmcp-auth"]
resolver = "2"

[workspace.package]
edition      = "2024"
rust-version = "1.89"
license      = "MIT"
repository   = "https://github.com/mechubsec/rustjunosmcp"
authors      = ["fastrevmd-lab"]

# Shared lint posture, adopted from rustpanosmcp so both servers can consume the
# mecmcp crate family on the same terms. See mechubsec/mecmcp PLAN.md.
#
# `unsafe_code` is `forbid` as of mecmcp Phase 3b (mecmcp#35). Unlike `deny`,
# `forbid` cannot be locally overridden, so no future `#[allow]` can reintroduce
# unsafe code into a server that holds credentials for a firewall fleet.
#
# Reaching it took two steps. Phase 1 replaced rust-junosmcp-auth's hand-rolled
# `write_volatile` secret zeroing with the `zeroize` crate. Phase 3b moved SIGHUP
# signalling into `mecmcp-runtime`, which reaches the syscall through `rustix`
# rather than `libc::kill` — that removed the last two allows, in `token_cmd.rs`
# and the `http_reload` test.
# `missing_docs` and `clippy::unwrap_used` are deferred, NOT dismissed: this
# codebase predates the house style rustpanosmcp was written into, and enabling
# them emits ~730 and ~960 findings respectively. Left at "warn" they would bury
# every genuinely new warning, so they are "allow" until the debt is paid.
#
# Documentation and safety lints. `missing_docs` was addressed in #193:
# all public items in rust-junosmcp-srx-core are documented. `unwrap_used`
# has been addressed: all unwraps in shipping code are now `.expect()` with
# invariant messages; test code is allowed via
# `#![cfg_attr(test, allow(clippy::unwrap_used))]` at crate level and
# `#![allow(clippy::unwrap_used)]` in separate test files.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code  = "forbid"

[workspace.lints.clippy]
all         = { level = "warn", priority = -1 }
dbg_macro   = "deny"
todo        = "deny"
unwrap_used = "deny"

[workspace.dependencies]
tokio        = { version = "1", features = ["full"] }
tokio-util   = { version = "0.7", default-features = false, features = ["rt"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "2"
tracing      = "0.1"
async-trait      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars     = "1.0"
anyhow       = "1"
rustez       = "0.19"
# `version` is redundant for resolution alongside `tag`, but cargo-deny reads a
# versionless dependency as a wildcard and rejects it under [bans].
# All mecmcp crates MUST resolve to the same git ref. Cargo keys a git
# dependency on its source, not just its version, so two different refs produce
# two copies of mecmcp-auth in the graph — and two distinct `CallerCtx` types
# with different TypeIds. `Extensions::get::<CallerCtx>()` then silently returns
# None, and every per-token limit stops enforcing while still logging as
# configured. That is not theoretical: it already happened in this repo.
#
# mecmcp 0.7.0: adds graceful HTTP shutdown, GracefulShutdown::new returns Result.
# mecmcp 0.8.6: adds ConfigAuthority and config_authority field to OperationRecord.
# mecmcp 0.12.0: Attribution gains approver and change_set_id, so every struct
# literal of it must name them. Also carries the stateless-path provenance
# capture (mecmcp#288), which populates model_id/session_id/client_name for
# clients that declare MCP 2026-07-28 and are routed without a session header.
# mecmcp 0.17.0: adds resolve_token_path and find_stale_secrets to mecmcp-auth.
# mecmcp 0.26.0: mecmcp-redact gains a Junos profile (`mecmcp_redact::junos`)
# covering the two gaps this repo's own support-bundle redactor filled by
# hand: a bare `<value>` element (NTP authentication-key secret) and a
# config-syntax-aware line redactor for non-XML support-bundle artefacts.
# mecmcp 0.26.1: closes the remaining XML redaction-coverage gap in the
# Junos profile; this repo's support-bundle XML test no longer needs an
# uncovered-key exclusion list.
# mecmcp 0.27.0: adds the verified-approver-identity core (MEC-994):
# mecmcp-auth's ApproverPolicy/bind_approver, mecmcp-changeset's
# ApproverIdentity/OwnerSubject and ChangesetCoordinator::load_with_key /
# with_require_verified_approver, mecmcp-transport's (feature-gated)
# ApproverAssertionVerifier, and mecmcp-runtime's VerifiedApproverArgs. Also
# adds mecmcp-oidc and mecmcp-http, newly pulled in directly to build the
# TokenVerifier this server's --oidc-issuer wiring needs (MEC-995).
#
# mecmcp is consumed at an exact pinned tag; all crates must resolve to the
# same git ref (see the TypeId note above).
mecmcp-audit = { version = "0.27.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.27.0" }
mecmcp-auth  = { version = "0.27.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.27.0" }
mecmcp-transport = { version = "0.27.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.27.0" }
mecmcp-runtime = { version = "0.27.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.27.0" }
mecmcp-policy = { version = "0.27.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.27.0" }
mecmcp-inventory = { version = "0.27.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.27.0" }
mecmcp-device = { version = "0.27.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.27.0" }
mecmcp-changeset = { version = "0.27.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.27.0" }
mecmcp-scp = { version = "0.27.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.27.0" }
mecmcp-secret = { version = "0.27.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.27.0" }
mecmcp-redact = { version = "0.27.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.27.0" }
mecmcp-oidc = { version = "0.27.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.27.0" }
mecmcp-http = { version = "0.27.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.27.0" }
globset      = "0.4"
regex        = "1"
metrics                     = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }

# auth + remote transport (sub-project #2)
arc-swap         = "1"
sha2             = "0.11"
hmac             = "0.13"
rand             = "0.10"
subtle           = "2"
base64ct         = { version = "1", features = ["alloc"] }
chrono           = { version = "0.4", default-features = false, features = ["serde", "clock"] }
axum             = "0.8"
tower            = "0.5"
tower-http       = "0.7"
http             = "1"
http-body-util   = "0.1"
rustls           = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
axum-server      = { version = "0.8", default-features = false }
rcgen            = "0.14"
tempfile         = "3"
ureq             = "2"
minijinja        = { version = "2", default-features = false, features = ["builtins", "loader", "serde"] }
dashmap          = "6"
http-body        = "1"
rustnetconf      = "0.18.1"
rustix           = "1.1"

# Release build profile: LTO + strip for smaller binaries.
#
# This profile reduces the shipped binary from ~38.8 MB (unstripped, no LTO) to
# ~10–14 MB. The trade-off is slower release builds: `codegen-units = 1` plus
# thin LTO makes CI meaningfully slower. If that becomes painful, keep dev/CI
# on defaults and apply this profile only where release artifacts are produced.
#
# `panic = "abort"` is evaluated separately: it changes unwinding semantics and
# interacts with the integration tests that spawn the binary and assert on
# failure paths.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
