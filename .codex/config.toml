#:schema https://developers.openai.com/codex/config-schema.json

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false
writable_roots = []
exclude_tmpdir_env_var = true
exclude_slash_tmp = true

[mcp_servers.gbrain]
enabled = false

[mcp_servers.proxmox-mcp]
enabled = false

# Renamed 2026-11-10: the global config now defines unifi as
# `prod-labmode-unifi` and `prod-unifi2mcp`. The old `unifi-mcp` override
# resolved to nothing, which fails the whole file (see the note below).
[mcp_servers.prod-labmode-unifi]
enabled = false

[mcp_servers.prod-unifi2mcp]
enabled = false

# Renamed 2026-08-19: the fleet moved to `prod-*` names on 2026-08-16 and no
# server called `rust-junosmcp` exists in the global config any more. An
# override for a server that is defined nowhere has no transport, which newer
# codex rejects outright — `Error loading config.toml: invalid transport` — so
# this file blocked `codex exec review` in this repo entirely.
[mcp_servers.prod-labmode-junos]
enabled = true
enabled_tools = ["get_router_list", "gather_device_facts", "get_junos_config", "junos_config_diff", "commit_check_config"]
default_tools_approval_mode = "writes"

[mcp_servers.openaiDeveloperDocs]
enabled = true
enabled_tools = ["search_openai_docs", "fetch_openai_doc"]
