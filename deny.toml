# cargo-deny policy, aligned with rustpanosmcp so both consumers of the mecmcp
# crate family enforce the same supply-chain posture.
# See mechubsec/mecmcp PLAN.md, Phase 0.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # chrono is unmaintained (no fix exists). It is required non-optionally by rmcp, oauth2 and mecmcp; revisit when rmcp drops it.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; required by rmcp/oauth2, no maintained replacement upstream" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    # foldhash, reached transitively through hashbrown. Permissive, OSI-approved.
    "Zlib",
]
# winx (Windows-only, via rmcp skills-fs -> cap-std) ships only the LLVM exception
# variant; the exception only loosens Apache-2.0, so it is scoped to this crate.
exceptions = [
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "winx" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The shared mecmcp crate family, consumed as a tag-pinned git dependency until
# the interfaces stabilise enough to publish. `unknown-git = "deny"` above still
# rejects every other git source, so this is one named exception rather than a
# blanket allowance. Remove it once mecmcp-auth is on crates.io.
#
# rustnetconf is pinned to a rev (MEC-44) carrying `HostKeyVerification::AcceptNew`
# (mechubsec/rustnetconf#108), ahead of a tagged release. Remove this entry and
# the `[patch.crates-io]` block in Cargo.toml once rustnetconf cuts a release
# that includes it.
allow-git = ["https://github.com/mechubsec/mecmcp", "https://github.com/mechubsec/rustnetconf"]
